name: Build Windows Installer

# Builds on a native windows-latest runner so electron-builder needs no wine
# workarounds. Trigger manually from the Actions tab, or push a tag like
# v1.0.0 to build and publish a GitHub Release automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to auto-generate one."
        required: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    # Pinned to windows-2022 rather than windows-latest: that most recently
    # resolved to a windows-2025-vs2026 preview image whose Visual Studio
    # version node-gyp doesn't recognize ("unknown version 'undefined'"),
    # breaking any node-gyp-based build on that runner outright.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (skip install-time scripts)
        # `npm ci` attempts a node-gyp source build for better-sqlite3 (which
        # ships prebuilt N-API binaries for every platform, win32-x64
        # included) that isn't needed for a plain Node target and previously
        # failed here on VS detection. --ignore-scripts skips that (and every
        # other) install-time script; the ones we actually need run below.
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Rebuild native modules for Electron's ABI
        # better-sqlite3's bundled prebuilt binary targets plain Node's N-API
        # ABI. N-API is supposed to be ABI-stable across Node and Electron
        # builds, but empirically that bundled prebuild crashes on startup
        # inside Electron's embedded Node/V8 (reproduced independently on
        # both Linux and Windows) even though it works perfectly under plain
        # Node every time. Rebuilding it specifically against the Electron
        # version this app ships is the actual fix — this needs real
        # internet access to fetch Electron's headers, which this GitHub-
        # hosted runner has and the sandboxed dev environment that first
        # built this app did not.
        #
        # Went through @electron/rebuild first (both bare `npx electron-
        # rebuild` and `npx @electron/rebuild`/`--package=` forms), which
        # kept failing on this Windows/pwsh runner — first on npx's own
        # package/bin resolution, then, once that was worked around by
        # installing it locally, it reported "Rebuild Complete" while
        # silently NOT producing a linked binary at all (verified: build/
        # Release/ only had compiler intermediates, no better_sqlite3.node,
        # and the shipped prebuilds/win32-x64.node was byte-identical to the
        # untouched original — a false-positive success). Calling node-gyp
        # directly, with no abstraction layer hiding its output or silently
        # swallowing a failed link step, is more transparent and is exactly
        # what better-sqlite3's own "build-release" package.json script does.
        run: |
          npm install --no-save node-gyp
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "Rebuilding better-sqlite3 for Electron $electronVersion"

          # The actual root cause of the previous silent no-op: better-
          # sqlite3's own binding.gyp computes prebuild_exists by running
          # `node lib/binding.js` at gyp-configure time, and its real
          # 'better_sqlite3' target only has real sources/deps when
          # prebuild_exists==0 — otherwise it's declared 'type': 'none', an
          # intentionally empty target (so a bare `npm install` never
          # recompiles when a matching prebuild is already bundled). Since
          # prebuilds/win32-x64.node was still sitting there when gyp
          # configured, it built that empty target and reported success in
          # ~4 seconds having done nothing. Removing the file first is what
          # actually flips prebuild_exists to 0 and activates the real target.
          Remove-Item node_modules/better-sqlite3/prebuilds/win32-x64.node -Force

          Push-Location node_modules/better-sqlite3
          npx node-gyp rebuild --target=$electronVersion --arch=x64 --dist-url=https://electronjs.org/headers --verbose
          Pop-Location

      - name: Verify the native rebuild actually produced a binary, and install it
        # Don't trust a tool's own "success" message — the previous attempt
        # printed "Rebuild Complete" while producing no linked output at all.
        # Fail loudly here instead of silently shipping the untouched
        # original (Node-ABI, not Electron-ABI) prebuild again.
        #
        # Second, more fundamental issue found by reading better-sqlite3's
        # own loader (lib/binding.js -> getPrebuildPath()): a normal
        # `require('better-sqlite3')` ALWAYS checks prebuilds/win32-x64.node
        # first and uses it if present — it never even looks at build/
        # Release unless that prebuilds file is missing. Since the bundled
        # prebuild always exists, a build/Release output alone would be
        # silently ignored at runtime even if node-gyp had linked it
        # successfully. The rebuilt binary must overwrite prebuilds/
        # win32-x64.node — that's the only file this package's loader ever
        # actually checks on Windows.
        run: |
          $builtFile = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $builtFile)) {
            Write-Error "Rebuilt binary not found at $builtFile — native rebuild silently failed."
            exit 1
          }
          Get-Item $builtFile | Format-List Name, Length, LastWriteTime
          Copy-Item $builtFile "node_modules/better-sqlite3/prebuilds/win32-x64.node" -Force
          Write-Host "Installed rebuilt binary over prebuilds/win32-x64.node (the file better-sqlite3's loader actually checks first)"

      - name: Build Next.js static export
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Windows installer
        run: npx electron-builder --win --publish=never

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "GhsoonZahran ${{ steps.tag.outputs.tag }}"
          files: release/GhsoonZahran-Setup.exe
          draft: false
          prerelease: false
