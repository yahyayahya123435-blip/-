appId: com.ghsoonzahran.charity
productName: GhsoonZahran
copyright: جمعية غصون زهران الخيرية

# better-sqlite3 ships prebuilt N-API binaries for every platform/arch inside
# the npm package itself (node_modules/better-sqlite3/prebuilds/*.node) and
# selects the right one at require() time — no per-target compilation needed.
# electron-builder's default native-rebuild step tries to rebuild from source
# instead, which node-gyp cannot cross-compile for win32 from this Linux
# build machine; skipping it lets the bundled win32-x64 prebuild ship as-is.
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  # electron/dist/generated is the custom-output Prisma Client (see
  # prisma/schema.prisma), copied there by scripts/copy-generated-prisma.js
  # as part of `npm run build:electron`. It deliberately does NOT live under
  # node_modules/.prisma (the default) — electron-builder's file matching
  # never picks up that dot-prefixed directory even when node_modules/**/*
  # is included, which made the packaged app throw "Cannot find module
  # '.prisma/client/default'" at startup despite working in every dev/test
  # run. A plain output directory sidesteps the bug entirely.
  - electron/dist/**/*
  - package.json
  - node_modules/**/*
  - "!src/**/*"
  - "!electron/*.ts"
  - "!electron/ipc/*.ts"
  - "!electron/tsconfig.json"
  - "!**/*.ts"
  - "!**/*.map"
  # Build-time-only packages never required by the compiled electron/dist
  # main-process code (verified: nothing under electron/, src/lib, or
  # src/services imports next/react — those are renderer-only and already
  # baked into the static export in out/). Excluding them keeps the
  # installer from bundling a second, unused copy of Next.js/React/webpack.
  - "!node_modules/next/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/typescript/**"
  - "!node_modules/tailwindcss/**"
  - "!node_modules/postcss/**"
  - "!node_modules/autoprefixer/**"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/concurrently/**"
  - "!node_modules/wait-on/**"
  - "!node_modules/tsx/**"
  - "!node_modules/prisma/**"
  - "!node_modules/@types/**"

extraResources:
  - from: out
    to: out
  - from: prisma/migrations
    to: prisma/migrations
  - from: prisma/sqlite-sql
    to: prisma/sqlite-sql
  # The association's member register, read by the first-run import wizard.
  # Shipped as data rather than baked into code so the source of the 330
  # families stays inspectable on the installed machine.
  - from: resources/seed
    to: resources/seed

asarUnpack:
  - "**/*.node"
  - node_modules/@prisma/**
  - node_modules/better-sqlite3/**

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: GhsoonZahran-Setup.${ext}
  # Building the Windows target from a Linux CI/sandbox host with no wine
  # installed: signing and PE resource editing both shell out to Windows
  # tools via wine. This produces an unsigned installer (expected — there is
  # no code-signing certificate for this project) without requiring wine.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: جمعية غصون زهران

linux:
  target:
    - AppImage
  category: Office

publish: null
