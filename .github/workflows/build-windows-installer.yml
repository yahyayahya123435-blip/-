name: Build Windows Installer

# Builds on a native windows-latest runner so electron-builder needs no wine
# workarounds. Trigger manually from the Actions tab, or push a tag like
# v1.0.0 to build and publish a GitHub Release automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to auto-generate one."
        required: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    # Pinned to windows-2022 rather than windows-latest: that most recently
    # resolved to a windows-2025-vs2026 preview image whose Visual Studio
    # version node-gyp doesn't recognize ("unknown version 'undefined'"),
    # breaking any node-gyp-based build on that runner outright.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (skip install-time scripts)
        # `npm ci` attempts a node-gyp source build for better-sqlite3 (which
        # ships prebuilt N-API binaries for every platform, win32-x64
        # included) that isn't needed for a plain Node target and previously
        # failed here on VS detection. --ignore-scripts skips that (and every
        # other) install-time script; the ones we actually need run below.
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Rebuild native modules for Electron's ABI
        # better-sqlite3's bundled prebuilt binary targets plain Node's N-API
        # ABI. N-API is supposed to be ABI-stable across Node and Electron
        # builds, but empirically that bundled prebuild crashes on startup
        # inside Electron's embedded Node/V8 (reproduced independently on
        # both Linux and Windows) even though it works perfectly under plain
        # Node every time. Rebuilding it specifically against the Electron
        # version this app ships (read from package.json's devDependencies)
        # is the actual fix — this needs real internet access to fetch
        # Electron's headers, which this GitHub-hosted runner has and the
        # sandboxed dev environment that first built this app did not.
        #
        # Bare `npx electron-rebuild` resolves the old, abandoned
        # "electron-rebuild" package (last published years ago as v3.2.9),
        # not the actively maintained "@electron/rebuild" — that old package
        # bundles a node-gyp too old for this runner's Python (which has
        # dropped the `distutils` module old node-gyp still imports),
        # failing with "ModuleNotFoundError: No module named 'distutils'".
        # The scoped package name avoids that entirely.
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Next.js static export
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Windows installer
        run: npx electron-builder --win --publish=never

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "GhsoonZahran ${{ steps.tag.outputs.tag }}"
          files: release/GhsoonZahran-Setup.exe
          draft: false
          prerelease: false
