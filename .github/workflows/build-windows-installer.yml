name: Build Windows Installer

# Builds on a native windows-latest runner so electron-builder needs no wine
# workarounds. Trigger manually from the Actions tab, or push a tag like
# v1.0.0 to build and publish a GitHub Release automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to auto-generate one."
        required: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # better-sqlite3@13 declares engines.node >= 22. On a Node-version
          # mismatch its install script falls back to compiling from source
          # via node-gyp instead of using its bundled prebuilt binary, which
          # then fails here because this runner's Visual Studio/MSVC C++
          # toolchain isn't set up for node-gyp. Matching the engine
          # requirement avoids the source-build path entirely.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Windows installer
        run: npx electron-builder --win --publish=never

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "GhsoonZahran ${{ steps.tag.outputs.tag }}"
          files: release/GhsoonZahran-Setup.exe
          draft: false
          prerelease: false
